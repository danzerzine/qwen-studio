# Builds Qwen Studio on every push to main and puts the zip into the release "latest"; a tag v* also makes its own release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only the release steps need it

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        shell: cmd
        run: build.cmd
      - name: Pack
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath QwenStudio-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QwenStudio-win-x64
          path: dist/
      # every push to main replaces the "latest" release: Releases always has the newest build
      - name: Latest build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest --yes --cleanup-tag || true    # absent on the first run
          gh release create latest QwenStudio-win-x64.zip --target "${{ github.sha }}" --prerelease --title "Последняя сборка" --notes "Собрано из ${{ github.sha }}. Обновляется при каждой отправке в main. Для проверенной версии берите релиз с номером."
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" QwenStudio-win-x64.zip --title "Qwen Studio ${{ github.ref_name }}" --generate-notes
